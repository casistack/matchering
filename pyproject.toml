[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enhanced-matchering"
version = "3.0.0"
description = "Enhanced Audio Mastering with AI Auto-Mastering - Inspired by Matchering + Mixea"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "GPL-3.0"}
authors = [
    {name = "Sergree", email = "sergree@vk.com"},
]
maintainers = [
    {name = "Sergree", email = "sergree@vk.com"},
]
keywords = [
    "audio",
    "mastering",
    "matching",
    "dsp",
    "music",
    "production",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Other Audience",
    "Natural Language :: English",
    "Topic :: Artistic Software",
    "Topic :: Multimedia",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Multimedia :: Sound/Audio :: Conversion",
    "Topic :: Utilities",
]
# Enhanced Matchering - Core Dependencies (Python 3.12 compatible)
dependencies = [
    "numpy>=1.26.0", # Python 3.12 compatible
    "scipy>=1.11.0",
    "soundfile>=0.12.0",
    "redis>=5.0.0",
    "torch>=2.5.1",
    "torchaudio>=2.5.1",
    "transformers>=4.46.3",
    "accelerate>=1.0.1",
    "scikit-learn>=1.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.0.0",
    "black>=22.0.0",
    "flake8>=5.0.0",
    "isort>=5.10.0",
]
web = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "celery>=5.3.0",
    "redis>=5.0.0",
    "websockets>=12.0",
    "python-multipart>=0.0.6",
    "sqlalchemy>=2.0.0",
    "alembic>=1.12.0",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.19.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.25.0",
    "aiofiles>=23.2.1",
    "structlog>=23.1.0",
    "cryptography>=41.0.0",
]
ai = [
    "librosa>=0.10.1",
    "scikit-learn>=1.3.0",
    "redis>=5.0.0",
    # Platform-specific PyTorch (uncomment based on your platform)
    # macOS Intel: use CPU-only torch
    "torch>=2.1.0; platform_machine != 'arm64'",
    # Linux/Windows with CUDA (for your RTX 4090 machines)
    # "torch>=2.1.0+cu121; platform_system == 'Linux'",
    # "torchaudio>=2.1.0",
    # Future ML dependencies
    # "transformers>=4.35.0",
    # "onnx>=1.15.0",
]

# Development dependencies (macOS Intel compatible - no problematic packages)
ai-dev = [
    "scikit-learn>=1.3.0", 
    # Core audio processing without librosa/numba conflicts
    "torch>=2.1.0",
    # Optional: only install if needed for development
    # "librosa>=0.10.1",  # Causes numba issues on Python 3.12
]

# GPU-optimized for RTX 4090 production (Python 3.12 compatible)
ai-gpu = [
    "numpy>=1.26.0",  # Python 3.12 compatible
    "scipy>=1.11.0",
    "scikit-learn>=1.4.0",
    "soundfile>=0.12.0",
    # CUDA-enabled PyTorch for RTX 4090
    "torch>=2.1.0",
    "torchaudio>=2.1.0", 
    "transformers>=4.35.0",
    "accelerate>=0.25.0",
    # We'll implement our own audio processing pipeline without problematic deps
]

[project.urls]
Homepage = "https://github.com/sergree/matchering"
Repository = "https://github.com/sergree/matchering"
Issues = "https://github.com/sergree/matchering/issues"
Changelog = "https://github.com/sergree/matchering/releases"

[tool.setuptools.packages.find]
include = ["matchering*"]

[tool.black]
line-length = 88
target-version = ['py38']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 88

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = [
    "tests",
]
python_files = [
    "test_*.py",
    "*_test.py",
]
python_classes = [
    "Test*",
]
python_functions = [
    "test_*",
]

[tool.coverage.run]
source = ["matchering"]
omit = [
    "*/tests/*",
    "*/test_*",
    "setup.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
]
